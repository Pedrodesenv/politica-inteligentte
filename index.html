<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligentte Lab — Documentos Legais</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            text-align: center;
            max-width: 480px;
            padding: 3rem 2rem;
        }
        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .sub { opacity: 0.6; margin-bottom: 2.5rem; font-size: 0.95rem; }
        .links { display: flex; flex-direction: column; gap: 1rem; }
        .links a {
            display: block;
            padding: 1rem 1.5rem;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: background 0.2s, transform 0.2s;
        }
        .links a:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }
        .links a span {
            display: block;
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.5;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Inteligentte Lab</div>
        <p class="sub">Documentos Legais</p>
        <div class="links">
            <a href="/politica-de-privacidade.html">
                Política de Privacidade
                <span>Conforme LGPD — Lei nº 13.709/2018</span>
            </a>
            <a href="/termos-de-servico.html">
                Termos de Serviço
                <span>Condições de uso dos nossos serviços</span>
            </a>
        </div>
    </div>
</body>
</html>
